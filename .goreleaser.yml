version: 2

project_name: oh-my-beszel

before:
  hooks:
    - go mod tidy
    - bun install --cwd ./internal/site --frozen-lockfile
    - bun run --cwd ./internal/site build

builds:
  - id: beszel
    binary: beszel
    main: internal/cmd/hub/hub.go
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=nojsonv2
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm

  - id: beszel-agent
    binary: beszel-agent
    main: internal/cmd/agent/agent.go
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=nojsonv2
    goos:
      - linux
      - darwin
      - freebsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - mips64
      - riscv64
      - mipsle
      - mips
      - ppc64le
    gomips:
      - hardfloat
      - softfloat
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
      - goos: linux
        goarch: mips64
        gomips: softfloat
      - goos: linux
        goarch: mipsle
        gomips: hardfloat
      - goos: linux
        goarch: mips
        gomips: hardfloat
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: riscv64

  - id: beszel-agent-linux-amd64-glibc
    binary: beszel-agent
    main: internal/cmd/agent/agent.go
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=nojsonv2
    flags:
      - -tags=glibc
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: beszel-agent
    formats: [tar.gz]
    ids:
      - beszel-agent
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: beszel-agent-linux-amd64-glibc
    formats: [tar.gz]
    ids:
      - beszel-agent-linux-amd64-glibc
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}_glibc

  - id: beszel
    formats: [tar.gz]
    ids:
      - beszel
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  draft: true

changelog:
  disable: true
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
